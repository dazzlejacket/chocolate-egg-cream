name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Compile macOS Core Audio Taps helper
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos13.0 -o tools/SystemAudioCapture tools/SystemAudioCapture.swift
          file tools/SystemAudioCapture

      - name: Run core tests
        run: python tests/test_core.py

      - name: Run scrobble flow tests
        run: python tests/test_scrobble_flow.py

      - name: Run v1.0.1 regression tests
        run: python tests/test_regressions.py

  package:
    # Build the real artifact on every push and run the packaged executable's
    # own `verify` command (real TLS through requests + aiohttp, CA bundle,
    # recognition stack, audio helper). A bundle that would ship broken --
    # e.g. missing cacert.pem -- fails here instead of reaching users.
    name: Package & verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt -r requirements-build.txt

      - name: Compile macOS Core Audio Taps helper
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos13.0 -o tools/SystemAudioCapture tools/SystemAudioCapture.swift

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libpulse0 fuse3 file
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build Windows EXE (with packaged verify gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/build_windows.ps1 -PythonExe python

      - name: Build macOS app + DMG (with packaged verify gate)
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh

      - name: Build Linux AppImage (with packaged verify gate)
        if: runner.os == 'Linux'
        run: bash scripts/build_linux.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/release/*
            dist/verify-report.json
          if-no-files-found: error
