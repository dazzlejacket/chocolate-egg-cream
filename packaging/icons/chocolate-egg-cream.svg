<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background: clean soft squircle badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#181224"/>
  <rect x="34" y="34" width="444" height="444" rx="98" fill="#231938"/>

  <!-- Subtle grounded shadow under the egg -->
  <ellipse cx="256" cy="414" rx="96" ry="18" fill="#120c1d"/>

  <!-- Original cozy purple egg silhouette (wider base, gently tapered crown) -->
  <path d="M 256 84
           C 324 84, 384 198, 384 292
           C 384 366, 330 412, 256 412
           C 182 412, 128 366, 128 292
           C 128 198, 188 84, 256 84 Z"
        fill="#7c4ddb" stroke="#f6f1ff" stroke-width="14" stroke-linejoin="round"/>

  <!-- Soft cozy shadow crescent on lower-right -->
  <path d="M 332 152
           C 362 200, 376 248, 376 292
           C 376 360, 326 404, 256 404
           C 226 404, 198 394, 178 378
           C 202 388, 228 392, 254 390
           C 316 384, 354 338, 354 274
           C 354 226, 344 184, 332 152 Z"
        fill="#5b32b8"/>

  <!-- Cream wave band across the lower belly (nod to Egg Cream!) -->
  <clipPath id="egg-clip">
    <path d="M 256 91
             C 320 91, 377 200, 377 292
             C 377 362, 326 405, 256 405
             C 186 405, 135 362, 135 292
             C 135 200, 192 91, 256 91 Z"/>
  </clipPath>
  <g clip-path="url(#egg-clip)">
    <path d="M 110 262
             Q 162 238, 214 262
             T 318 262
             T 410 262
             L 410 318
             Q 358 294, 306 318
             T 202 318
             T 110 318 Z"
          fill="#f6f1ff"/>
    <path d="M 110 296
             Q 162 276, 214 296
             T 318 296
             T 410 296
             L 410 322
             L 110 322 Z"
          fill="#d9c8ff"/>
  </g>

  <!-- Crisp playful highlight on upper-left shoulder -->
  <ellipse cx="206" cy="182" rx="18" ry="34" transform="rotate(-18 206 182)" fill="#f6f1ff" opacity="0.92"/>
  <circle cx="192" cy="230" r="9" fill="#f6f1ff" opacity="0.88"/>
</svg>
